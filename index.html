<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Tracker - Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Login CSS -->
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row vh-100">

            <!-- Left Side -->

            <div class="col-lg-7 left-side d-none d-lg-flex">

                <div class="overlay">

                    <h1>Business Tracker</h1>

                    <p>

                        Manage Customers, Expenses, Income & Profit Easily

                    </p>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-5 right-side">

                <div class="login-card">

                    <div class="text-center mb-4">

                        <h2>Welcome Back</h2>

                        <p>Please login to continue</p>

                    </div>

                    <form id="loginForm">

                        <!-- Email -->

                        <div class="mb-3">

                            <label>Email</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-envelope-fill"></i>

                        </span>

                                <input type="email" id="email" class="form-control" placeholder="Enter Email" required>

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label>Password</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                                <input type="password" id="password" class="form-control" placeholder="Enter Password" required>

                                <button type="button" class="btn btn-outline-secondary" id="togglePassword">

                            <i class="bi bi-eye-fill"></i>

                        </button>

                            </div>

                        </div>

                        <!-- Remember -->

                        <div class="d-flex justify-content-between mb-4">

                            <div>

                                <input type="checkbox" id="remember">

                                <label for="remember">

                            Remember Me

                        </label>

                            </div>


                            <button class="btn btn-primary w-100" id="loginBtn" type="submit">

                    <span id="loginText">

                        Login

                    </span>

                    <span
                            id="loginSpinner"
                            class="spinner-border spinner-border-sm ms-2 d-none">

                    </span>

                </button>

                    </form>

                    </div>

                </div>

            </div>

        </div>


        <!-- ==========================================
     Toast Message
========================================== -->

        <div class="toast-container position-fixed bottom-0 end-0 p-3">

            <div id="appToast" class="toast align-items-center text-bg-success border-0" role="alert">

                <div class="d-flex">

                    <div class="toast-body" id="toastMessage">

                        Success

                    </div>

                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
            </button>

                </div>

            </div>

        </div>

        <!-- ==========================================
     JavaScript Files
========================================== -->

        <script src="js/config.js"></script>

        <script src="js/common.js"></script>

        <script src="js/login.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
