<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Tracker - Register</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/register.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row vh-100">

            <!-- Left Side -->

            <div class="col-lg-7 left-side d-none d-lg-flex">

                <div class="overlay">

                    <h1>Business Tracker</h1>

                    <p>Create your account and manage your business easily.</p>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-5 right-side">

                <div class="register-card">

                    <div class="text-center mb-4">

                        <h2>Create Account</h2>

                        <p>Register to continue</p>

                    </div>

                    <form id="registerForm">

                        <!-- Name -->

                        <div class="mb-3">

                            <label>Full Name</label>

                            <div class="input-group">

                                <span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>

                                <input type="text" class="form-control" id="name" placeholder="Enter Full Name" required>

                            </div>

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label>Email</label>

                            <div class="input-group">

                                <span class="input-group-text">

<i class="bi bi-envelope-fill"></i>

</span>

                                <input type="email" class="form-control" id="email" placeholder="Enter Email" required>

                            </div>

                        </div>

                        <!-- Phone -->

                        <div class="mb-3">

                            <label>Phone Number</label>

                            <div class="input-group">

                                <span class="input-group-text">

<i class="bi bi-telephone-fill"></i>

</span>

                                <input type="text" class="form-control" id="phone" placeholder="Enter Phone Number" required>

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label>Password</label>

                            <div class="input-group">

                                <span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>

                                <input type="password" class="form-control" id="password" placeholder="Enter Password" required>

                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">

<i class="bi bi-eye-fill"></i>

</button>

                            </div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label>Confirm Password</label>

                            <div class="input-group">

                                <span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>

                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>

                                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">

<i class="bi bi-eye-fill"></i>

</button>

                            </div>

                        </div>

                        <!-- Terms -->

                        <div class="form-check mb-4">

                            <input class="form-check-input" type="checkbox" id="terms" required>

                            <label class="form-check-label" for="terms">

I agree to the Terms & Conditions

</label>

                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="registerBtn">
    <span id="registerText">Register</span>
    <span id="registerSpinner"
          class="spinner-border spinner-border-sm ms-2 d-none"
          role="status"></span>
</button>

                        <div class="text-center mt-4">

                            Already have an account?

                            <a href="index.html">

Login

</a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
