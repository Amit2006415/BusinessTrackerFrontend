<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Business Tracker</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/register.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row vh-100">

            <!-- Left Side -->

            <div class="col-lg-7 left-side d-none d-lg-flex">

                <div class="overlay">

                    <h1>Business Tracker</h1>

                    <p>
                        Create your account and manage your business from anywhere.
                    </p>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-5 right-side">

                <div class="register-card">

                    <h2>Create Account</h2>

                    <p>Register to continue</p>

                    <form id="registerForm">

                        <!-- Full Name -->

                        <div class="mb-3">

                            <label>Full Name</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-person-fill"></i>

                        </span>

                                <input type="text" class="form-control" id="fullName" placeholder="Enter Full Name" required>

                            </div>

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label>Email</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-envelope-fill"></i>

                        </span>

                                <input type="email" class="form-control" id="email" placeholder="Enter Email" required>

                            </div>

                        </div>

                        <!-- Mobile -->

                        <div class="mb-3">

                            <label>Mobile Number</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-telephone-fill"></i>

                        </span>

                                <input type="text" class="form-control" id="mobile" placeholder="Enter Mobile Number" required>

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label>Password</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                                <input type="password" class="form-control" id="password" placeholder="Enter Password" required>

                            </div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label>Confirm Password</label>

                            <div class="input-group">

                                <span class="input-group-text">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>

                            </div>

                        </div>

                        <!-- Security Question -->

                        <div class="mb-3">

                            <label>Security Question</label>

                            <select id="securityQuestion" class="form-select" required>

                        <option value="">
                            Select Question
                        </option>

                        <option>
                            What is your favourite dish?
                        </option>

                        <option>
                            What is your favourite colour?
                        </option>

                        <option>
                            What is your favourite movie?
                        </option>

                        <option>
                            What is your favourite place?
                        </option>

                        <option>
                            What is your pet's name?
                        </option>

                        <option>
                            What was your first school?
                        </option>

                        <option>
                            What is your childhood nickname?
                        </option>

                    </select>

                        </div>

                        <!-- Security Answer -->

                        <div class="mb-4">

                            <label>Security Answer</label>

                            <input type="text" id="securityAnswer" class="form-control" placeholder="Enter Answer" required>

                        </div>

                        <div class="form-check mb-3">

                            <input class="form-check-input" type="checkbox" id="terms" required>

                            <label class="form-check-label">

        I agree to the Terms & Conditions

    </label>

                        </div>

                        <!-- Button -->

                        <button class="btn btn-primary w-100" id="registerBtn" type="submit">

                    <span id="registerText">

                        Create Account

                    </span>

                    <span
                        id="registerSpinner"
                        class="spinner-border spinner-border-sm ms-2 d-none">

                    </span>

                </button>

                        <div class="text-center mt-4">

                            Already have an account?

                            <a href="index.html">

                        Login

                    </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
