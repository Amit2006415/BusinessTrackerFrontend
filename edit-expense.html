<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | Business Tracker</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/add-expense.css">

</head>

<body>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark">

                <h3>
                    <i class="bi bi-pencil-square"></i> Edit Expense
                </h3>

            </div>

            <div class="card-body">

                <form id="expenseForm">

                    <input type="hidden" id="expenseId">

                    <div class="mb-3">

                        <label class="form-label">Expense Name</label>

                        <input type="text" id="expenseName" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Expense Date</label>

                        <input type="date" id="expenseDate" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Amount</label>

                        <input type="number" id="amount" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Description</label>

                        <textarea id="description" class="form-control" rows="4"></textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-warning">

                        <i class="bi bi-check-circle"></i>

                        Update Expense

                    </button>

                        <a href="expenses.html" class="btn btn-secondary">

                        Back

                    </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Toast -->

    <div class="toast-container">

        <div id="appToast" class="toast align-items-center text-bg-success border-0">

            <div class="d-flex">

                <div class="toast-body" id="toastMessage">

                    Success

                </div>

                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
            </button>

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/edit-expense.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
