<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers | Business Tracker</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/customers.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Business Tracker</h2>
            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="bi bi-speedometer2"></i>
                        <span data-lang="dashboard">Dashboard</span>
                    </a>
                </li>

                <li class="active">
                    <a href="customers.html">
                        <i class="bi bi-people-fill"></i>
                        <span data-lang="customers">Customers</span>
                    </a>
                </li>

                <li>
                    <a href="expenses.html">
                        <i class="bi bi-wallet2"></i>
                        <span data-lang="expenses">Expenses</span>
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        <i class="bi bi-bar-chart-fill"></i>
                        <span data-lang="reports">Reports</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        <span data-lang="logout">Logout</span>
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->
        <main class="content">

            <div class="topbar">

                <!-- Left -->
                <div class="d-flex align-items-center">

                    <button class="btn btn-primary me-3" id="menuBtn">
            <i class="bi bi-list"></i>
        </button>

                    <h2 class="mb-0" data-lang="customers">
                        Customers
                    </h2>

                </div>

                <!-- Right -->
                <div class="d-flex align-items-center">

                    <select id="languageSelect" class="form-select me-3" style="width:150px;">

            <option value="en">English</option>
            <option value="mr">मराठी</option>

        </select>

                </div>

            </div>

            <button class="btn btn-primary" onclick="window.location='add-customer.html'">

            <i class="bi bi-plus-circle"></i>
<span data-lang="addCustomer">Add Customer</span>

        </button><br> <br>

            <!-- Search -->

            <div class="card mb-4 p-3">

                <input type="text" id="search" class="form-control" placeholder="Search Customer..." onkeyup="searchCustomer()">

            </div>



            <!-- Customer Table -->

            <div class="card">

                <div class="card-header bg-primary text-white">

                    <h4 data-lang="customerList">Customer List</h4>

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <thead>

                                    <tr>

                                        <th data-lang="id">ID</th>
                                        <th data-lang="name">Name</th>
                                        <th data-lang="date">Date</th>
                                        <th data-lang="product">Product</th>
                                        <th data-lang="total">Total</th>
                                        <th data-lang="advance">Advance</th>
                                        <th data-lang="due">Due</th>
                                        <th data-lang="status">Status</th>
                                        <th data-lang="action">Action</th>

                                    </tr>

                                </thead>

                            </tr>

                        </thead>

                        <tbody id="customerTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Toast -->

    <div class="toast-container position-fixed top-0 end-0 p-3">

        <div id="appToast" class="toast align-items-center text-bg-success border-0">

            <div class="d-flex">

                <div class="toast-body" id="toastMessage">

                    Success

                </div>

                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- JavaScript Files -->
    <!-- ========================= -->

    <!-- Load Config FIRST -->
    <script src="js/config.js"></script>

    <!-- Common Functions -->
    <script src="js/common.js"></script>

    <!-- Customer Logic -->
    <script src="js/customers.js"></script>

    <script src="js/language.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
