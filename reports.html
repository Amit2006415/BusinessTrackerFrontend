<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | Business Tracker</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/report.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Business Tracker</h2>
            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="bi bi-speedometer2"></i>
                        <span data-lang="dashboard">Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="customers.html">
                        <i class="bi bi-people-fill"></i>
                        <span data-lang="customers">Customers</span>
                    </a>
                </li>

                <li>
                    <a href="expenses.html">
                        <i class="bi bi-wallet2"></i>
                        <span data-lang="expenses">Expenses</span>
                    </a>
                </li>

                <li class="active">
                    <a href="reports.html">
                        <i class="bi bi-bar-chart-fill"></i>
                        <span data-lang="reports">Reports</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        <span data-lang="logout">Logout</span>
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->
        <main class="content">

            <div class="topbar">

                <!-- Left -->
                <div class="d-flex align-items-center">

                    <button class="btn btn-primary me-3" id="menuBtn">
            <i class="bi bi-list"></i>
        </button>

                    <h2 class="mb-0" data-lang="businessReports">
                        Business Reports
                    </h2>

                </div>

                <!-- Right -->
                <div class="d-flex align-items-center">

                    <select id="languageSelect" class="form-select me-3" style="width:150px;">

            <option value="en">English</option>
            <option value="mr">मराठी</option>

        </select>

                    <button class="btn btn-success" onclick="window.print()">

           <i class="bi bi-printer-fill"></i>

<span data-lang="printReport">
    Print Report
</span>

        </button>

                </div>

            </div>

            <div class="row g-4">

                <div class="col-md-4">

                    <div class="card income-card">

                        <div class="card-body">

                            <h5 data-lang="totalIncome">
                                Total Income
                            </h5>

                            <h2 id="income">₹0</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card expense-card">

                        <div class="card-body">

                            <h5 data-lang="totalExpense">
                                Total Expense
                            </h5>

                            <h2 id="expense">₹0</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card profit-card">

                        <div class="card-body">

                            <h5 data-lang="totalProfit">
                                Total Profit
                            </h5>

                            <h2 id="profit">₹0</h2>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Toast -->
    <div class="toast-container">

        <div id="appToast" class="toast align-items-center text-bg-success border-0">

            <div class="d-flex">

                <div class="toast-body" id="toastMessage">
                    Success
                </div>

                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>

    <!-- Load Config First -->
    <script src="js/config.js"></script>

    <script src="js/common.js"></script>

    <script src="js/language.js"></script>

    <script src="js/report.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</html>
