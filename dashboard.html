<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Tracker Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <h2>Business Tracker</h2>

            </div>

            <ul>

                <li class="active">

                    <a href="dashboard.html">

                        <i class="bi bi-speedometer2"></i> Dashboard

                    </a>

                </li>

                <li>

                    <a href="customers.html">

                        <i class="bi bi-people-fill"></i> Customers

                    </a>

                </li>

                <li>

                    <a href="expenses.html">

                        <i class="bi bi-wallet2"></i> Expenses

                    </a>

                </li>

                <li>

                    <a href="reports.html">

                        <i class="bi bi-bar-chart-fill"></i> Reports

                    </a>

                </li>

                <li>

                    <a href="#" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->

        <main class="content">

            <div class="topbar">

                <button class="btn btn-primary d-lg-none" id="menuBtn">
    <i class="bi bi-list"></i>
</button>

                <h2>Dashboard</h2>

                <div class="admin">

                    <i class="bi bi-person-circle"></i>

                    <span>Administrator</span>

                    <button class="btn btn-outline-light ms-3" id="themeToggle">🌙</button>

                </div>

            </div>

            <!-- Cards -->

            <div class="row g-4">

                <div class="col-lg-4">

                    <div class="card dashboard-card customers">

                        <h5>Total Customers</h5>

                        <h2 id="totalCustomers">0</h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card income">

                        <h5>Total Income</h5>

                        <h2 id="totalIncome">₹0</h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card expense">

                        <h5>Total Expense</h5>

                        <h2 id="totalExpense">₹0</h2>

                    </div>

                </div>
                <div class="col-lg-4">

                    <div class="card dashboard-card profit">

                        <h5>Total Profit</h5>

                        <h2 id="totalProfit">₹0</h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card paid">

                        <h5>Paid Customers</h5>

                        <h2 id="paidCustomers">0</h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card unpaid">

                        <h5>Unpaid Customers</h5>

                        <h2 id="unpaidCustomers">0</h2>

                    </div>

                </div>

            </div>

            <!-- Recent Customers -->

            <div class="card table-card mt-5">

                <div class="card-header">

                    <h4>Recent Customers</h4>

                </div>

                <div class="card-body">

                    <table class="table table-hover">

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Name</th>
                                <th>Product</th>
                                <th>Total</th>
                                <th>Advance</th>
                                <th>Due</th>
                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="customerTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>
    <div class="toast-container">

        <div id="appToast" class="toast align-items-center text-bg-success border-0">

            <div class="d-flex">

                <div class="toast-body" id="toastMessage">

                    Success

                </div>

                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
            </button>

            </div>

        </div>

    </div>

    <!-- Load Config First -->
    <script src="js/config.js"></script>

    <!-- Common Functions -->
    <script src="js/common.js"></script>

    <!-- Dashboard Logic -->
    <script src="js/dashboard.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
