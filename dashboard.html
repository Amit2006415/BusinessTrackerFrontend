<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Tracker Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <h2>Business Tracker</h2>

            </div>

            <ul>

                <li class="active">

                    <a href="dashboard.html">

                        <i class="bi bi-speedometer2"></i>

                        <span data-lang="dashboard">
                        Dashboard
                    </span>

                    </a>

                </li>

                <li>

                    <a href="customers.html">

                        <i class="bi bi-people-fill"></i>

                        <span data-lang="customers">
                        Customers
                    </span>

                    </a>

                </li>

                <li>

                    <a href="expenses.html">

                        <i class="bi bi-wallet2"></i>

                        <span data-lang="expenses">
                        Expenses
                    </span>

                    </a>

                </li>

                <li>

                    <a href="reports.html">

                        <i class="bi bi-bar-chart-fill"></i>

                        <span data-lang="reports">
                        Reports
                    </span>

                    </a>

                </li>


            </ul>

        </aside>

        <!-- Main Content -->

        <main class="content">

            <!-- Topbar -->

            <div class="topbar">

                <div class="d-flex align-items-center">

                    <button class="btn btn-primary me-3" id="menuBtn">

                    <i class="bi bi-list"></i>

                </button>

                    <h2 class="mb-0" data-lang="dashboard">

                        Dashboard

                    </h2>

                </div>

                <div class="d-flex align-items-center">

                    <select id="languageSelect" class="form-select" style="width:160px;">

                    <option value="en">
                        English
                    </option>

                    <option value="mr">
                        मराठी
                    </option>

                </select>

                </div>

            </div>

            <!-- Dashboard Cards -->

            <div class="row g-4">

                <div class="col-lg-4">

                    <div class="card dashboard-card customers">

                        <h5 data-lang="totalCustomers">

                            Total Customers

                        </h5>

                        <h2 id="totalCustomers">

                            0

                        </h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card income">

                        <h5 data-lang="totalIncome">

                            Total Income

                        </h5>

                        <h2 id="totalIncome">

                            ₹0

                        </h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card expense">

                        <h5 data-lang="totalExpense">

                            Total Expense

                        </h5>

                        <h2 id="totalExpense">

                            ₹0

                        </h2>

                    </div>

                </div>
                <div class="col-lg-4">

                    <div class="card dashboard-card profit">

                        <h5 data-lang="totalProfit">
                            Total Profit
                        </h5>

                        <h2 id="totalProfit">
                            ₹0
                        </h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card paid" onclick="openPaidCustomers()" style="cursor:pointer;">

                        <h5 data-lang="paidCustomers">
                            Paid Customers
                        </h5>

                        <h2 id="paidCustomers">
                            0
                        </h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card dashboard-card unpaid" onclick="openUnpaidCustomers()" style="cursor:pointer;">

                        <h5 data-lang="unpaidCustomers">
                            Unpaid Customers
                        </h5>

                        <h2 id="unpaidCustomers">
                            0
                        </h2>

                    </div>

                </div>

            </div>

            <!-- Recent Customers -->

            <div class="card table-card mt-5">

                <div class="card-header">

                    <h4 data-lang="recentCustomers">
                        Recent Customers
                    </h4>

                </div>

                <div class="card-body">

                    <table class="table table-hover">

                        <thead>

                            <tr>

                                <th data-lang="id">ID</th>
                                <th data-lang="name">Name</th>
                                <th data-lang="product">Product</th>
                                <th data-lang="total">Total</th>
                                <th data-lang="advance">Advance</th>
                                <th data-lang="due">Due</th>
                                <th data-lang="status">Status</th>

                            </tr>

                        </thead>

                        <tbody id="customerTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Toast -->

    <div class="toast-container">

        <div id="appToast" class="toast align-items-center text-bg-success border-0">

            <div class="d-flex">

                <div class="toast-body" id="toastMessage">

                    Success

                </div>

                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
            </button>

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="js/config.js"></script>
    <script>
        console.log("Dashboard HTML Loaded");
    </script>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/language.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
